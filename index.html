<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Longevity Courtyard · Virtual Assistant</title>
<meta name="theme-color" content="#003057" />
<meta name="description" content="Longevity Courtyard virtual assistant — bookings, programmes, hours and more. In collaboration with HUR and Tzu-Chi Foundation." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003057; --navy-2:#003a66; --navy-ink:#0b2438;
    --cyan:#00A6E6; --cyan-deep:#0089c4; --cyan-soft:#e6f6fd;
    --gold:#C79A3E; --gold-soft:#f7efdd;
    --wa:#25D366; --wa-deep:#1ebe5b;
    --bg:#eef4f9; --surface:#ffffff; --line:#e2ecf3;
    --ink:#12293f; --muted:#5f7488;
    --shadow:0 18px 50px rgba(0,48,87,.16);
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Plus Jakarta Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 700px at 50% -10%, #dcebf7 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 120%, #e4f4fb 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    display:flex;justify-content:center;align-items:stretch;
    padding:0;
  }
  .app{
    width:100%;max-width:480px;height:100dvh;background:var(--surface);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  @media(min-width:520px){
    body{padding:22px;align-items:center;}
    .app{height:min(880px,96dvh);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(0,48,87,.08);}
  }

  /* ---------- Header ---------- */
  .header{position:relative;flex:0 0 auto;background:var(--navy);}
  .header img{display:block;width:100%;height:auto;}
  .statusbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 16px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .status{display:flex;align-items:center;gap:9px;color:#dcecf8;font-size:13.5px;font-weight:600;letter-spacing:.2px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.55);}70%{box-shadow:0 0 0 8px rgba(61,220,132,0);}100%{box-shadow:0 0 0 0 rgba(61,220,132,0);}}
  .lang{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;gap:2px;}
  .lang button{
    border:0;background:transparent;color:#cfe4f3;font-family:inherit;font-weight:700;
    font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.2s;min-width:44px;
  }
  .lang button.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.18);}

  /* swoosh accent */
  .accent{height:14px;background:linear-gradient(180deg,var(--navy-2),transparent);position:relative;overflow:hidden;}
  .accent svg{position:absolute;left:0;bottom:-2px;width:200%;height:26px;}

  /* ---------- Chat ---------- */
  .chat{flex:1 1 auto;overflow-y:auto;padding:20px 15px 8px;scroll-behavior:smooth;}
  .chat::-webkit-scrollbar{width:7px;}
  .chat::-webkit-scrollbar-thumb{background:#cdddea;border-radius:8px;}

  .row{display:flex;margin:0 0 14px;gap:9px;align-items:flex-end;animation:rise .34s cubic-bezier(.2,.8,.25,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}
  .avatar{width:38px;height:38px;border-radius:12px;flex:0 0 auto;background:#fff;border:1px solid var(--line);
    box-shadow:0 3px 10px rgba(0,48,87,.10);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:contain;}
  .bubble{max-width:80%;padding:13px 16px;font-size:16.5px;line-height:1.55;position:relative;}
  .bot .bubble{background:#fff;border:1px solid var(--line);color:var(--ink);
    border-radius:20px 20px 20px 6px;box-shadow:0 6px 18px rgba(0,48,87,.07);}
  .user .bubble{background:linear-gradient(135deg,var(--cyan) 0%,var(--cyan-deep) 100%);color:#fff;
    border-radius:20px 20px 6px 20px;box-shadow:0 8px 20px rgba(0,166,230,.28);font-weight:600;}
  .bubble strong{color:var(--navy);font-weight:800;}
  .user .bubble strong{color:#fff;}
  .bubble .hd{display:block;font-weight:800;color:var(--navy);font-size:17.5px;margin:2px 0 7px;letter-spacing:-.2px;}
  .bubble .li{display:block;margin:3px 0;}
  .time{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin:5px 4px 0;letter-spacing:.3px;}
  .user .stack{display:flex;flex-direction:column;align-items:flex-end;}
  .bot .stack{display:flex;flex-direction:column;align-items:flex-start;}

  /* typing */
  .typing{display:inline-flex;gap:5px;padding:15px 17px;}
  .typing i{width:8px;height:8px;border-radius:50%;background:#9fc0d6;animation:blink 1.3s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;} .typing i:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  /* quick replies */
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 4px 20px 47px;animation:rise .4s .05s both;}
  .quick.single{grid-template-columns:1fr;}
  .chip{
    border:2px solid #cfe6f4;background:#fff;color:var(--navy);font-family:inherit;font-weight:700;
    font-size:15px;line-height:1.25;padding:13px 12px;border-radius:15px;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:8px;min-height:52px;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s;
  }
  .chip:hover{border-color:var(--cyan);box-shadow:0 6px 16px rgba(0,166,230,.16);transform:translateY(-1px);}
  .chip:active{transform:translateY(0) scale(.99);}
  .chip .em{font-size:19px;flex:0 0 auto;}
  .chip.primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(0,166,230,.30);}
  .chip.primary:hover{filter:brightness(1.05);}
  .chip.ghost{background:#f4f8fc;border-color:#e0ebf3;color:var(--muted);font-weight:600;}

  /* location card */
  .loc-card{margin:2px 4px 20px 47px;background:#fff;border:1px solid var(--line);border-radius:18px;
    box-shadow:0 8px 22px rgba(0,48,87,.10);overflow:hidden;animation:rise .4s .05s both;}
  .loc-head{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;font-weight:800;
    font-size:15px;padding:12px 15px;letter-spacing:.2px;display:flex;align-items:center;gap:7px;}
  .loc-addr{padding:14px 15px 4px;font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.45;}
  .loc-mrt{padding:2px 15px 13px;font-size:14px;color:var(--muted);font-weight:600;line-height:1.4;}
  .loc-map{margin:0 12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:#e7f0f7 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="%2394b3c9" stroke-width="1.6"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.4"/></svg>') center/32px no-repeat;
    height:184px;}
  .loc-map iframe{width:100%;height:100%;border:0;display:block;}
  .loc-gethere{margin:14px 12px 12px;padding-top:13px;border-top:1px solid var(--line);}
  .gh-title{font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
  .gh-toggle{display:flex;gap:6px;background:#eef4f9;padding:4px;border-radius:13px;margin-bottom:11px;}
  .gh-tab{flex:1;border:0;background:transparent;font-family:inherit;font-weight:700;font-size:14.5px;color:var(--muted);
    padding:10px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;min-height:44px;}
  .gh-tab.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,48,87,.14);}
  .gh-body{font-size:14.5px;line-height:1.55;color:var(--ink);margin-bottom:12px;}
  .gh-body b{color:var(--navy);}
  .gh-go{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:13px;
    background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#fff;text-decoration:none;font-weight:800;
    font-size:15.5px;box-shadow:0 8px 18px rgba(0,166,230,.28);transition:filter .2s,transform .12s;}
  .gh-go:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .gh-go svg{width:19px;height:19px;}

  /* whatsapp cta inside chat */
  .wa-cta{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 4px 20px 47px;
    background:linear-gradient(135deg,var(--wa),var(--wa-deep));color:#fff;text-decoration:none;
    font-weight:800;font-size:16.5px;padding:15px 16px;border-radius:16px;box-shadow:0 10px 24px rgba(37,211,102,.32);
    transition:transform .12s,filter .2s;animation:rise .4s .05s both;}
  .wa-cta:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .wa-cta svg{width:22px;height:22px;flex:0 0 auto;}

  /* ---------- Composer ---------- */
  .dock{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:9px 12px calc(9px + env(safe-area-inset-bottom));}
  .actions{display:flex;gap:8px;margin-bottom:9px;}
  .actions button{flex:1;border:0;border-radius:13px;padding:11px 8px;font-family:inherit;font-weight:800;font-size:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .2s;}
  .actions button:active{transform:scale(.98);}
  .btn-book{background:linear-gradient(135deg,var(--gold),#b5852f);color:#fff;box-shadow:0 6px 16px rgba(199,154,62,.30);}
  .btn-menu{background:var(--cyan-soft);color:var(--navy);}
  .compose{display:flex;gap:8px;align-items:flex-end;}
  .compose textarea{
    flex:1;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-family:inherit;font-size:16px;
    resize:none;max-height:96px;color:var(--ink);background:#f8fbfd;line-height:1.4;
  }
  .compose textarea:focus{outline:none;border-color:var(--cyan);background:#fff;box-shadow:0 0 0 4px rgba(0,166,230,.12);}
  .send{flex:0 0 auto;width:50px;height:50px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));
    color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,166,230,.30);transition:transform .12s,filter .2s;}
  .send:hover{filter:brightness(1.06);} .send:active{transform:scale(.96);}
  .send svg{width:22px;height:22px;}

  :focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:12px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
  }
  @media(max-width:360px){
    .bubble{font-size:15.5px;} .chip{font-size:14px;}
  }
</style>
</head>

/* Normalise: lowercase, strip punctuation, keep letters/numbers/$ and CJK, pad with spaces. */
function norm(s){
  let t=" "+s.toLowerCase().replace(/[’']/g,"")+" ";
  t=t.replace(/[^\p{L}\p{N}$]+/gu," ");
  return t.replace(/\s+/g," ");
}
/* A term "hits" the text: phrases, CJK, $ and longer words match as substrings;
   short English words (≤3 chars) match on word boundaries to avoid false positives. */
function hit(text,term){
  if(term.includes(" ")||term==="$"||/[^\x00-\x7F]/.test(term)||term.length>=4){
    return text.indexOf(term)>=0;
  }
  return text.indexOf(" "+term+" ")>=0;
}

function matchIntent(raw){
  const t=norm(raw); let best=null,score=0;
  for(const it of INTENTS){
    let s=0;
    for(const term of it.terms){ if(hit(t,term)) s+=term.includes(" ")?2:1; }
    if(s>score){ score=s; best=it.id; }
  }
  return score>0?best:null;
}

/* Special replies that aren't full nodes */
const REPLIES={
  thanks:{en:"You're most welcome! 🙏 Is there anything else I can help you with?",
          zh:"不客气！🙏 还有什么可以帮您的吗？"},
  eligibility:{
    en:"<span class='hd'>👵 Who is it for?</span>Our programmes are made for <strong>seniors and older adults of all fitness levels</strong>. Every exercise is safe, controlled and scaled to you, so <strong>no prior experience is needed</strong> — our coaches guide you through each session and track your progress with proper assessments.<br><br>The best way to see if it fits is to try a trial. 😊",
    zh:"<span class='hd'>👵 适合谁参加？</span>我们的课程专为<strong>各种体能水平的乐龄与年长者</strong>而设计。每个动作都安全、可控，并依据您的情况调整，<strong>无需任何运动经验</strong> — 教练会全程指导，并透过专业评估记录您的进步。<br><br>最好的方式，就是先来体验一堂。😊"}
};
const CHIP_BOOK={em:"📅",to:"book",primary:true,en:"Book a trial",zh:"预约体验课"};
const CHIP_PROG={em:"🏋️",to:"programmes",en:"Our programmes",zh:"训练课程"};
const CHIP_MENU={em:"↩️",to:"menu",ghost:true,en:"Back to menu",zh:"返回主菜单"};

function botReply(pair,chips,waNode){
  const typing=addTyping();
  setTimeout(()=>{
    typing.remove();
    addBotBubble(pair[lang]);
    if(waNode) addWaCta(waNode);
    if(chips) addChips(chips);
  },600);
}

function fallback(){
  const typing=addTyping();
  setTimeout(()=>{
    typing.remove();
    addBotBubble(lang==="en"
      ? "I want to make sure I give you the right information 🙏 — here's what I can help with. Tap a topic below, or message our coach directly on WhatsApp."
      : "为了给您正确的信息 🙏，以下是我可以帮您的。请点击下方选项，或直接用 WhatsApp 联系我们的教练。");
    addWaCta({wa:{textKey:"ask",labelKey:"waMsg"}});
    addChips(MENU_CHIPS);
  },700);
}

function handleIntent(id){
  if(!id){ fallback(); return; }
  if(id==="thanks"){ botReply(REPLIES.thanks,MENU_CHIPS); return; }
  if(id==="eligibility"){ botReply(REPLIES.eligibility,[CHIP_BOOK,CHIP_PROG,CHIP_MENU]); return; }
  go(id);
}

function sendTyped(){
  const raw=input.value.trim(); if(!raw)return;
  input.value=""; grow(input);
  addUser(raw);
  handleIntent(matchIntent(raw));
}

function onKey(e){ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendTyped();} }
function grow(t){t.style.height="auto";t.style.height=Math.min(t.scrollHeight,96)+"px";}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* Language */
function setLang(l){
  if(l===lang)return;
  lang=l;
  document.documentElement.lang = l==="zh"?"zh":"en";
  document.getElementById("langEn").classList.toggle("active",l==="en");
  document.getElementById("langZh").classList.toggle("active",l==="zh");
  document.getElementById("statusText").textContent=T.statusOnline[l];
  document.getElementById("dockBook").textContent=T.dockBook[l];
  document.getElementById("dockMenu").textContent=T.dockMenu[l];
  input.placeholder=T.placeholder[l];
  chat.innerHTML="";
  renderNode("welcome");
}

/* Boot */
window.addEventListener("load",()=>{ renderNode("welcome"); });
</script>
</body>
</html>
